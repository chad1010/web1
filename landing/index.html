<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="채미 미디어 — 인사이드 크리에이터 · 머니픽 뉴스" />
  <title>채미 미디어</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #101010; color: #fff;
      font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 24px;
    }
    .box { max-width: 760px; width: 100%; }
    h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: #d9ff3d; margin-bottom: 10px; }
    .sub { color: rgba(255,255,255,0.55); font-size: 15px; margin-bottom: 40px; }
    .links { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
    a.site {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid rgba(255,255,255,0.16); border-radius: 20px;
      padding: 30px 28px; transition: border-color .15s, transform .15s;
    }
    a.site:hover { border-color: #d9ff3d; transform: translateY(-3px); }
    a.site strong { display: block; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 8px; }
    a.site span { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }
    a.site .go { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 700; color: #d9ff3d; }
    .green strong em { font-style: normal; color: #00b26b; }
    @media (max-width: 640px) { .links { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <h1>CHAEMI MEDIA</h1>
    <p class="sub">채미가 만드는 두 개의 인터넷 미디어</p>
    <div class="links">
      <a class="site" href="./insidecreator/">
        <strong>인사이드 크리에이터</strong>
        <span>크리에이터의 속 이야기를 꺼내는 인터뷰 전문 매체. 팔로워 수가 아니라 과정을 취재합니다.</span>
        <span class="go">들어가기 →</span>
      </a>
      <a class="site green" href="./moneypick/">
        <strong>머니<em>픽</em> 뉴스</strong>
        <span>재테크 앱·장비·도서를 직접 써보고 비교하는 리뷰·큐레이션 매체. 당신에게 맞는 것을 골라드립니다.</span>
        <span class="go">들어가기 →</span>
      </a>
    </div>
  </div>
</body>
</html>
